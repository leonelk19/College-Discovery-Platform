services:
  - type: web
    name: college-discovery-api
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.6

databases:
  - name: college-db
    plan: free
